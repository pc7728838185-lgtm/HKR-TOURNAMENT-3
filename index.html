<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808"><meta name="description" content="HKR Tournaments - Free Fire esports tournament platform">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>HKR Tournaments</title>
<style>
.auth-actions{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.auth-link{background:none;border:0;color:#ff9f1c;text-decoration:underline;cursor:pointer;padding:8px 0}
.auth-note{font-size:12px;opacity:.75;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><img src="assets/hkr-logo.png" alt="HKR"><span>HKR Tournaments</span></div><nav><button data-page="home">Home</button><button data-page="matches">My Matches</button><button data-page="wallet">Wallet</button><button data-page="admin" id="adminNav" class="hidden">Admin</button><button id="authBtn">Login</button></nav></header>
<main>
<section id="home" class="page active"><div class="hero"><div><p class="eyebrow">FREE FIRE ESPORTS</p><h1>Play. Compete. <span>Win.</span></h1><p>Join verified HKR tournaments, submit your UTR and get your room details after approval.</p></div><img src="assets/hkr-logo.png" alt="HKR Tournaments logo"></div><div class="section-head"><h2>Live Tournaments</h2><button id="refreshBtn" class="ghost">Refresh</button></div><div id="tournamentGrid" class="grid"></div></section>
<section id="matches" class="page"><div class="section-head"><h2>My Matches</h2></div><div id="matchesList" class="stack"></div></section>
<section id="wallet" class="page"><div class="section-head"><h2>Wallet & Payout</h2></div><div class="card"><p>Wallet balance is maintained by the server/admin. Approved winnings appear here.</p><div id="walletBox"></div></div></section>
<section id="admin" class="page"><div class="section-head"><h2>Admin Control Center</h2><button id="adminLogout" class="ghost">Sign out</button></div><div class="admin-tabs"><button data-admin-tab="tournaments">Tournaments</button><button data-admin-tab="payments">Payments</button><button data-admin-tab="settings">Settings</button></div><div id="adminContent"></div></section>
</main>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script><script src="auth-update.js"></script>
</body></html>
